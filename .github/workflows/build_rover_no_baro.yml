name: Custom F405 TZ Rover 4.7.1 no barometer

on:
  push:
    paths:
      - '.github/workflows/build_rover_no_baro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      SKIP_AP_GRAPHIC_ENV: '1'
      SKIP_AP_COV_ENV: '1'
      SKIP_AP_GIT_CHECK: '1'
      DO_AP_STM_ENV: '0'
      DO_PYTHON_VENV_ENV: '1'

    steps:
      - name: Download ArduPilot Rover 4.7.1 sources
        run: |
          git clone --depth 1 --branch Rover-4.7.1 https://github.com/ArduPilot/ardupilot.git ardupilot
          cd ardupilot
          git submodule update --init --recursive --depth 1

      - name: Install STM32 GCC from Ubuntu packages (no firmware.ardupilot.org)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev libstdc++-arm-none-eabi-newlib
          command -v arm-none-eabi-gcc
          command -v arm-none-eabi-g++
          arm-none-eabi-gcc --version
          arm-none-eabi-g++ --version
          # Fail immediately if GCC cannot find standard C++ headers.
          printf '#include <type_traits>\\nstatic_assert(std::is_integral<int>::value, "missing ARM C++ headers");\\n' | \
            arm-none-eabi-g++ -mcpu=cortex-m4 -mthumb -std=gnu++14 -x c++ -fsyntax-only -
          # Verify the ARM target standard C++ library is installed.
          libstdcpp="$(arm-none-eabi-g++ -print-file-name=libstdc++.a)"
          test -f "$libstdcpp" || { echo "::error::Missing ARM libstdc++.a at $libstdcpp"; exit 1; }
          echo "ARM C++ headers and library OK: $libstdcpp"

      - name: Install ArduPilot build environment without its STM32 downloader
        working-directory: ardupilot
        run: |
          set -euo pipefail
          test "$DO_AP_STM_ENV" = 0
          Tools/environment_install/install-prereqs-ubuntu.sh -y
          echo "STM32 cross-compiler from OS:"
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version

      - name: Disable SPL06 and permit start without any barometer
        working-directory: ardupilot
        run: |
          set -euo pipefail
          f=libraries/AP_HAL_ChibiOS/hwdef/MatekF405-TE/hwdef.dat
          grep -Eq '^BARO SPL06 +I2C:0:0x76$' "$f"
          grep -Fxq 'define AP_BARO_SPL06_ENABLED 1' "$f"
          sed -i -E 's@^BARO SPL06 +I2C:0:0x76$@# BARO SPL06 I2C:0:0x76 -- disabled@' "$f"
          sed -i 's/^define AP_BARO_SPL06_ENABLED 1$/define AP_BARO_SPL06_ENABLED 0/' "$f"
          printf '\n# Permit Rover to boot with no barometer detected\ndefine HAL_BARO_ALLOW_INIT_NO_BARO 1\n' >> "$f"
          echo '---- Changed barometer configuration ----'
          grep -En 'BARO SPL06|AP_BARO_SPL06_ENABLED|HAL_BARO_ALLOW_INIT_NO_BARO' "$f"

      - name: Adapt hwdef to custom board pinout from TZ
        working-directory: ardupilot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path("libraries/AP_HAL_ChibiOS/hwdef/MatekF405-TE")
          p=base/"hwdef.dat"
          s=p.read_text()
          def change(pattern,replacement,label):
              global s
              s,n=re.subn(pattern,replacement,s,flags=re.M)
              if n!=1: raise RuntimeError(f"{label} expected one line, found {n}")
          change(r"^PB5\s+PINIO2\s+OUTPUT\s+GPIO\(82\)\s+LOW.*$", "PB5 CAN2_RX CAN2", "CAN2 RX")
          change(r"^PB6\s+TIM4_CH1\s+TIM4\s+PWM\(11\)\s+GPIO\(60\)\s+NODMA.*$", "PB6 CAN2_TX CAN2", "CAN2 TX")
          change(r"^PB1\s+TIM3_CH4\s+TIM3\s+PWM\(12\)\s+GPIO\(61\).*$", "PB1 RS485_DIR OUTPUT GPIO(61) LOW", "RS485 DIR")
          # Custom PCB has no OSD or SD card. W25Q128 SPI2 remains enabled.
          change(r"^PB12 OSD_CS CS$", "# No OSD on custom board", "OSD CS")
          change(r"^PC1\s+SDCARD_CS CS$", "# No SD card on custom board", "SD CS")
          change(r"^SPIDEV osd.*$", "# No OSD SPI device", "OSD")
          change(r"^SPIDEV sdcard.*$", "# No SD SPI device", "SD")
          change(r"^define OSD_ENABLED 1$", "define OSD_ENABLED 0", "OSD flag")
          # OSD is absent; disable MSP DisplayPort too, otherwise it compiles
          # references to OSD-only methods and fails get_current_screen().
          s += "\nundef HAL_WITH_MSP_DISPLAYPORT\ndefine HAL_WITH_MSP_DISPLAYPORT 0\nundef HAL_MSP_ENABLED\ndefine HAL_MSP_ENABLED 0\n"
          change(r"^define HAL_OSD_TYPE_DEFAULT 1$", "define HAL_OSD_TYPE_DEFAULT 0", "OSD type")
          change(r"^define HAL_OS_FATFS_IO 1$", "define HAL_OS_FATFS_IO 0", "FATFS")
          change(r"^ROMFS_WILDCARD libraries/AP_OSD/fonts/font0.bin$", "# No OSD font", "OSD font")
          for item in ("SPIDEV icm42605  SPI1","IMU Invensensev3 SPI:icm42605 ROTATION_YAW_90","PC14 IMU_CS CS","PB4  SPI1_MISO SPI1"):
              assert item in s, f"IMU setting missing: {item}"
          p.write_text(s)
          p=base/"hwdef-bl.dat"
          t=p.read_text()
          t,n=re.subn(r"^PB5\s+PINIO2\s+OUTPUT LOW.*\n","",t,flags=re.M)
          if n!=1: raise RuntimeError("bootloader PB5 pin mismatch")
          p.write_text(t)
          print("custom board patched")
          PY

      - name: Build firmware
        working-directory: ardupilot
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$HOME/venv-ardupilot/bin/activate"; then
            source "$HOME/venv-ardupilot/bin/activate"
          fi
          if test -f "$HOME/.profile"; then
            source "$HOME/.profile"
          fi
          if ! command -v arm-none-eabi-gcc >/dev/null; then
            gcc_path="$(find /opt -type f -name arm-none-eabi-gcc -print -quit)"
            if test -n "$gcc_path"; then
              export PATH="$(dirname "$gcc_path"):$PATH"
            fi
          fi
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          # ArduPilot firmware binary size must fit STM32F405 1 MB flash
          ./waf configure --board MatekF405-TE --bootloader
          ./waf bootloader -j2
          cp build/MatekF405-TE/bin/AP_Bootloader.bin Tools/bootloaders/MatekF405-TE_bl.bin
          ./waf configure --board MatekF405-TE
          ./waf rover -j2
          echo '---- Generated firmware files ----'
          ls -lh build/MatekF405-TE/bin/ardurover*

      - name: Downloadable APJ and HEX
        uses: actions/upload-artifact@v4
        with:
          name: ArduRover-CustomF405-TZ-NoBaro-CAN2
          path: |
            ardupilot/build/MatekF405-TE/bin/ardurover.apj
            ardupilot/build/MatekF405-TE/bin/ardurover.hex
            ardupilot/build/MatekF405-TE/bin/ardurover_with_bl.hex
          if-no-files-found: error
